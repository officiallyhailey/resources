<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore the route after the GitHub Pages 404 bounce (see public/404.html).
      // Must run before the app boots so the router starts on the right path and
      // the address bar never shows the detour.
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        sessionStorage.removeItem('spa-redirect');
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <title>Hailey Grace - Full-stack developer</title>
    <meta
      name="description"
      content="Full-stack developer building scalable, automated systems. Operations platforms, internal tools and client sites - built end to end."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Saved to a home screen, iOS uses apple-touch-icon and ignores the
         manifest's icons; Android uses the manifest. Both are needed. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Settle light or dark before first paint, so nobody watches the page
      // change mode as the bundle boots. Same two inputs as the app's own
      // useTheme, in the same order, because the two disagreeing IS the flash:
      // a stored choice if there is one, otherwise whatever the machine says.
      // Reading only the stored value here is what left a dark-mode visitor
      // looking at a white page until React mounted.
      // Sits below the meta tag it edits, and above the stylesheets.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(mode);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', mode === 'dark' ? '#000000' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Hailey Grace" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hailey Grace - Full-stack developer" />
    <meta
      property="og:description"
      content="Full-stack developer building scalable, automated systems. Operations platforms, internal tools and client sites - built end to end."
    />
    <meta property="og:url" content="https://anavahdesigns.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Still required by the Toolbox page (Anton/Bebas/Rubik in toolbox.css,
         Font Awesome icons in LinkList). Remove once that page is restyled -
         removing them before then breaks a page that is currently live. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Anton&family=Bebas+Neue&family=Rubik+Mono+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" crossorigin src="/assets/index-D3reMlkZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C6cyJPs5.css">
  </head>
  <body>
    <div id="root"></div>
    <!--
      Browsers restore the previous scroll position on reload, which drops a
      returning visitor into the middle of this one-page site with no context.
      This has to run BEFORE the bundle: setting it from a React effect is too
      late, because the browser has already restored by the time React mounts.

      Turning restoration off is enough on its own - a fresh load then starts at
      the top naturally. Do NOT add a scrollTo on the load event: that fires
      only after every image and iframe settles, so anyone who clicks a nav link
      before then is yanked back to the top mid-read.
    -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
  </body>
</html>
