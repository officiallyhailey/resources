<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Anavah Designs · scroll narrative</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   TOKENS
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#EFEDE8; --paper:#FBFAF8; --ink:#22201C; --muted:#7A776F;
  --rule:rgba(120,115,105,.18);
  --accent:#C86B43;
  --e:cubic-bezier(.16,1,.3,1);
  --pad-x:clamp(1.25rem,4.2vw,4rem);
  --wrap:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* HARD GATE: the document itself never scrolls. Sections are a deck of
   full-viewport panels and only the arrows move between them. A panel whose
   content is taller than the screen scrolls INSIDE itself, because content
   you cannot reach is not a gate, it is a bug. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ground);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad-x)}

/* the veil is the transition itself: a bank of light that thickens over a
   change so the swap happens inside it rather than in plain sight */
#veil{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:
    radial-gradient(70% 50% at 28% 58%,rgba(255,255,255,.95),rgba(255,255,255,0) 72%),
    radial-gradient(62% 44% at 74% 36%,rgba(255,255,255,.92),rgba(255,255,255,0) 74%),
    linear-gradient(180deg,rgba(250,249,245,.7),rgba(250,249,245,.95));
  transition:opacity .32s ease;will-change:opacity}
#veil.on{opacity:1}
main{position:fixed;inset:0;z-index:3}
.panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transform:translateY(26px);
  transition:opacity .42s var(--e),transform .42s var(--e),visibility 0s linear .42s}
/* visibility:hidden also takes an inactive panel out of the tab order, so the
   keyboard cannot wander into a section the reader has not reached */
.panel.active{opacity:1;visibility:visible;transform:none;
  transition:opacity .5s var(--e),transform .5s var(--e),visibility 0s}
/* direction: forward, a panel rises in from below and the old one leaves
   upward. Reverse mirrors it, so going back reads as going back. */
.panel.off{display:none}
.panel.from-above{transform:translateY(-26px)}
.panel.leave-down{transform:translateY(26px)}
.panel.leave-up{transform:translateY(-26px)}
.panel-inner{min-height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(3.5rem,8vh,5.5rem) 0 clamp(6rem,12vh,8rem)}

/* ══════════════════════════════════════════════════════════════════════
   THE TYPEWRITER
   Every line is laid out IN FULL before a single character shows, as one
   span per character, hidden. Typing only flips characters visible, so
   nothing ever reflows and the letters already written never move. That
   is the whole trick - the old version retyped into a growing text node,
   which re-centred the line on every keystroke.
   ══════════════════════════════════════════════════════════════════════ */
.tblock{display:block}
.tline{display:block;white-space:pre-wrap}
/* each word is held together: characters are separate inline spans, so
   without this a line could break in the middle of one */
.tline .w{white-space:nowrap}
/* Opacity, not visibility. The layout was already fixed either way - every
   character is placed before any of them show - but flipping visibility
   snapped each glyph on hard, which at display sizes reads as stuttering.
   A short fade turns the same reveal into one smooth wipe across the line.
   It also means the whole line is present for screen readers from the start,
   rather than being announced a letter at a time. */
.c{opacity:0;position:relative;transition:opacity .24s ease-out}
.c.on{opacity:1}
/* the caret rides the last revealed character and is absolutely placed, so
   it cannot push anything sideways either */
.c.tip::after{content:'';position:absolute;right:-.08em;top:.16em;bottom:.06em;
  width:.05em;background:var(--accent);opacity:.75;
  animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ══════════════════════════════════════════════════════════════════════
   STAGE ONE - the intro. Three beats sharing one screen, advanced by
   click rather than by scroll: each beat plays, stops, and waits.
   ══════════════════════════════════════════════════════════════════════ */
/* overflow-y:auto, not hidden: once the arc is in the beat this panel can be
   taller than a phone screen, and hidden clipped the bottom with no way to
   reach it. x stays hidden so a rotated arc card cannot widen the page. */
.stage{display:grid;place-items:center;
  padding:clamp(4.5rem,9vh,6rem) var(--pad-x) clamp(7rem,14vh,9rem);
  overflow-x:hidden;overflow-y:auto}
.beat{grid-area:1/1;width:100%;max-width:var(--wrap);
  opacity:0;transform:translateY(46px);pointer-events:none;
  transition:opacity .5s var(--e),transform .55s var(--e)}
.beat.on{opacity:1;transform:none;pointer-events:auto}
.beat.out{opacity:0;transform:translateY(-46px)}

.b-welcome{text-align:center}
.b-welcome .line{font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(2rem,5.4vw,4.2rem);line-height:1.14;letter-spacing:-.015em}
.b-welcome .sub{margin-top:1.5rem;line-height:1.9}

/* softness comes from a lighter GREY, not from low opacity */
.b-statement{text-align:center}
.b-statement .say{font-family:'Instrument Serif',serif;
  font-size:clamp(1.8rem,4.6vw,3.9rem);line-height:1.3;letter-spacing:-.02em;
  color:#5F5B54}
.b-statement em{font-style:italic;color:#B0603A}

/* the pair is centred as a unit, rather than a wide text column shoving the
   card out to the right */
/* Explicit column widths, not `auto`: an auto column is sized by the huge
   headline's max-content, which is wider than the text actually occupies and
   threw the pair off centre. Fixed widths make the two sit centred as a unit. */
/* The copy column hugs its text and the card column is fixed, so the pair
   centres on its actual ink. `auto` is safe here only because every typed
   block is laid out up front - sized lazily it would collapse to nothing and
   then shove the card sideways as the text arrived. */
/* copy | centre focus | the arc of work. The middle column is the anchor:
   the profile card sits there, and a chosen project takes its place. */
/* equal side columns, so the fixed centre column - and the profile card in
   it - is genuinely centred on the screen rather than merely between things */
.b-intro{position:relative;display:grid;
  grid-template-columns:minmax(0,1fr) 25rem minmax(0,1fr);
  justify-content:center;align-items:center;gap:clamp(1.2rem,3vw,2.6rem);
  width:100%;max-width:1420px}
/* the profile card sits ABOVE the ring, which is the whole point of it */
.b-intro .cardside{position:relative;z-index:5}
.b-intro .copyside{max-width:20rem;justify-self:end}
.b-intro .cardside{width:100%}

/* ── the centre focus slot ── */
.focus{position:relative;width:100%}
.focus-me,.focus-work{transition:opacity .55s var(--e),transform .65s var(--e)}
.focus-work{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.92);pointer-events:none}
.focus.on-work .focus-me{opacity:0;transform:scale(.94);pointer-events:none}
.focus.on-work .focus-work{opacity:1;transform:none;pointer-events:auto}

.wfocus{width:100%;background:var(--paper);border:1px solid rgba(255,255,255,.95);
  border-radius:22px;overflow:hidden;position:relative;
  box-shadow:0 40px 84px -34px rgba(60,55,45,.6)}
.wfocus .shot{display:block;aspect-ratio:4/2.9;overflow:hidden;background:#E4E2DC}
.wfocus .shot img{width:100%;height:100%;object-fit:cover;display:block}
.wfocus .body{padding:.95rem 1.1rem 1.15rem}
.wfocus .row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.wfocus h3{font-size:1.28rem;font-weight:600;letter-spacing:-.025em;margin:.3rem 0 .35rem}
.wfocus p{font-size:.83rem;color:var(--muted);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wfocus .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.65rem}
.wfocus .chips span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:.3rem .55rem;border-radius:100px;
  background:rgba(200,107,67,.1);color:#9C5433}
.wfocus .open{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;
  margin-top:.85rem;padding:.68rem;border-radius:100px;background:var(--ink);
  color:var(--paper);font-size:.86rem;font-weight:500}
.wfocus .open em{font-style:normal;transition:transform .35s var(--e)}
.wfocus .open:hover em{transform:translateX(4px)}
.wfocus .back{position:absolute;top:.65rem;right:.65rem;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:.9rem;line-height:1;
  box-shadow:0 6px 16px -8px rgba(60,55,45,.6);transition:background .3s,color .3s}
.wfocus .back:hover{background:var(--ink);color:var(--paper)}

/* ── the half circle ── */
/* The ring is centred on the profile card and runs behind it, so it is taken
   out of the grid entirely and placed against the beat. Deliberately NO
   z-index: that would make the arc its own stacking context and trap the
   cards behind the profile card, so a hovered one could never come forward.
   Their own z-index values compete with the profile card's directly. */
.arc{position:absolute;inset:0;pointer-events:none}
.acard-hit{pointer-events:auto}
.acard{position:absolute;top:0;left:0;width:var(--aw);
  transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(var(--s,1));
  transform-origin:50% 50%;z-index:var(--z);
  opacity:0;
  transition:transform .55s var(--e),opacity .5s var(--e),
             filter .45s var(--e),box-shadow .45s var(--e);
  will-change:transform}
/* the further back a card sits, the lighter it reads - the depth cue from
   the reference, where the darkest card is the one nearest the front */
.arc.dealt .acard{filter:saturate(var(--sat,1)) brightness(var(--br,1))}
.arc.dealt:not(.picked) .acard.lifted{filter:none}
.arc.dealt .acard.chosen{filter:none}
/* dealt out one after another once the line finishes */
.arc.dealt .acard{opacity:var(--o,1);transition-delay:calc(var(--i) * 70ms)}
.arc.dealt .acard.lifted,.arc.dealt .acard.chosen{transition-delay:0s}
.acard-hit{display:block;width:100%;text-align:left;border-radius:15px;overflow:hidden;
  background:var(--paper);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 16px 34px -18px rgba(60,55,45,.55)}
.acard .thumb{display:block;aspect-ratio:4/3;overflow:hidden;background:#E4E2DC}
.acard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.acard .cap{display:block;padding:.42rem .6rem .5rem;text-align:right}
.acard .cap b{display:block;font-size:.76rem;font-weight:600;letter-spacing:-.015em;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .cap span{display:block;font-family:'JetBrains Mono',monospace;font-size:7.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.14rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hover pops it forward off the arc */
/* :not(.picked) - once a project has been chosen the focus card in the middle
   is the subject, and a ring card rearing up in front of it fights for
   attention with the thing the reader just asked to see */
.arc.dealt:not(.picked) .acard.lifted{
  transform:translate(var(--x),calc(var(--y) - 14px)) rotate(0deg) scale(1.06);
  z-index:60}
.arc.dealt:not(.picked) .acard.lifted .acard-hit{box-shadow:0 26px 48px -20px rgba(60,55,45,.62)}
.arc.picked .acard{cursor:pointer}
.acard.chosen .acard-hit{border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(200,107,67,.45),0 22px 44px -20px rgba(60,55,45,.6)}
.b-intro h1{font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(3rem,8vw,6.4rem);line-height:1;letter-spacing:-.03em}
.b-intro .tools{margin-top:1.4rem;font-size:clamp(1rem,1.7vw,1.24rem);
  color:var(--muted);line-height:1.75}
.b-intro .cardside{display:flex;justify-content:center;align-items:center}

/* ── the profile card ── */
.pcard{width:min(100%,330px);background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px) saturate(1.1);border:1px solid rgba(255,255,255,.9);
  border-radius:24px;overflow:hidden;
  box-shadow:0 30px 70px -34px rgba(60,55,45,.55),0 2px 8px rgba(60,55,45,.05)}
.b-intro .pcard{width:100%;opacity:0;
  transform:translateY(52px) rotate(-4deg) scale(.9);
  transition:opacity 1.1s var(--e),transform 1.25s var(--e)}
.b-intro .pcard.shown{opacity:1;transform:none}
.pc-art{position:relative;aspect-ratio:4/3.4;overflow:hidden;background:#DDE3D8}
.pc-art img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.pc-rarity,.pc-no{position:absolute;top:.7rem;font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(255,255,255,.85);padding:.28rem .6rem;border-radius:100px}
.pc-rarity{left:.7rem;display:flex;align-items:center;gap:.4rem}
.pc-no{right:.7rem;color:var(--muted)}
.pc-dot{width:6px;height:6px;border-radius:50%;background:#7FA37B;flex:none}
.pc-name{position:absolute;left:0;right:0;bottom:0;padding:2.2rem .95rem .8rem;
  background:linear-gradient(transparent,rgba(255,255,255,.92) 62%)}
.pc-name b{display:block;font-size:1.05rem;font-weight:600;letter-spacing:-.015em}
.pc-name span{display:block;font-size:.74rem;color:var(--muted)}
.b-intro .pc-name b{font-size:1.25rem}
.b-intro .pc-name span{font-size:.82rem}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;padding:1rem .95rem}
.pc-stat b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.pc-stat span{display:block;font-size:.64rem;color:var(--muted);line-height:1.3;margin-top:.25rem}
.b-intro .pc-stat b{font-size:1.55rem}
.b-intro .pc-stat span{font-size:.7rem}
.b-intro .pc-stat{opacity:0;transform:translateY(14px);
  transition:opacity .7s var(--e),transform .7s var(--e)}
.b-intro .pcard.shown .pc-stat{opacity:1;transform:none}
.b-intro .pcard.shown .pc-stat:nth-child(1){transition-delay:.65s}
.b-intro .pcard.shown .pc-stat:nth-child(2){transition-delay:.8s}
.b-intro .pcard.shown .pc-stat:nth-child(3){transition-delay:.95s}
.pc-foot{display:flex;justify-content:space-between;gap:.6rem;padding:.7rem .95rem;
  border-top:1px solid var(--rule);font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ══════════════════════════════════════════════════════════════════════
   THE GATE - the control that ends every section. It appears only once
   that section has finished playing, which is what makes each section
   stop and wait rather than run on.
   ══════════════════════════════════════════════════════════════════════ */
/* Fixed, not in the flow: on a tall panel the gate used to sit below the fold
   and had to be scrolled to. It now holds the same line as the mail button so
   it is reachable the moment it appears, on every panel. */
.gate{position:fixed;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;z-index:70;
  /* lifted well clear of the bottom edge: sat level with the mail button it
     was an awkward reach on a phone and close to the browser's own chrome */
  padding:2.4rem 0 clamp(4rem,11vh,6.5rem);
  /* a soft floor rather than a hard edge: panel content fades out as it
     passes beneath instead of colliding with the controls */
  background:linear-gradient(transparent,rgba(239,237,232,.86) 42%,var(--ground) 76%);
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .45s var(--e),transform .45s var(--e)}
.gate.on{opacity:1;transform:none;pointer-events:auto}
.gate>*{pointer-events:auto}
/* nothing may run underneath it */
.panel-inner{padding-bottom:clamp(10rem,22vh,14rem)}
.stage{padding-bottom:clamp(10rem,22vh,14rem)}
.gate-row{display:flex;align-items:center;gap:.8rem}
/* going back is the same gesture upward - with no scroll, a reader who
   advanced would otherwise have no way to re-read a section */
.gate-back{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);
  display:grid;place-items:center;color:var(--muted);
  transition:background .3s,color .3s,transform .3s var(--e)}
.gate-back:hover{background:var(--ink);color:var(--paper);transform:translateY(-3px)}
.gate-back[hidden]{display:none}
.gate-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.gate-btn{position:relative;width:58px;height:58px;border-radius:50%;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 18px 38px -18px rgba(60,55,45,.6);display:grid;place-items:center;
  animation:bob 3.6s var(--e) infinite;transition:transform .35s var(--e),background .35s}
.gate-btn:hover{transform:translateY(5px);background:#fff}
.gate-btn::after{content:'';position:absolute;inset:-5px;border-radius:50%;
  border:1px solid var(--accent);opacity:0;animation:ring 2.8s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes ring{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.35);opacity:0}}

/* ══════════════════════════════════════════════════════════════════════
   SECTIONS
   ══════════════════════════════════════════════════════════════════════ */
/* no position here: every .sec is also a .panel, and .sec comes later in the
   sheet, so a `position:relative` would beat the panel's `absolute` and stop
   panels being viewport-height */
.sec{}
.sec-head{margin-bottom:clamp(2rem,5vh,3.2rem)}
.sec-head .idx{margin-bottom:.6rem}
.sectitle{font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(2.1rem,5.4vw,4rem);line-height:1.06;letter-spacing:-.025em}
.sectitle em{font-style:italic;color:var(--accent)}
.fade{opacity:0;transform:translateY(18px);
  transition:opacity 1s var(--e),transform 1s var(--e)}
.fade.in{opacity:1;transform:none}
.fade[data-d="1"]{transition-delay:.1s}
.fade[data-d="2"]{transition-delay:.2s}
.fade[data-d="3"]{transition-delay:.3s}

/* ══════════════════════════════════════════════════════════════════════
   PORTFOLIO - a coverflow that fans in from a single stack
   ══════════════════════════════════════════════════════════════════════ */
/* padded, not tight: a flush box clipped the card shadows into a hard flat
   line straight across the section. The mask softens the side edges instead
   of cutting them. */
.flow{position:relative;width:100%;height:clamp(470px,66vh,620px);
  overflow:hidden;padding:18px 0 26px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.flow-track{top:18px;bottom:26px;height:auto}
@media (max-width:900px){.flow-track{top:10px;bottom:16px}}
.flow-track{position:absolute;inset:0}
.fcard{position:absolute;top:50%;left:50%;width:var(--cw);
  transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));
  opacity:var(--o);filter:blur(var(--b)) saturate(var(--sat)) brightness(var(--br));
  z-index:var(--z);
  transition:transform .72s var(--e),opacity .55s var(--e),filter .55s var(--e);
  will-change:transform}
/* before the fan: every card stacked dead centre, square and invisible */
.flow:not(.fanned) .fcard{transform:translate(-50%,-50%) scale(.82);opacity:0;filter:none}
.flow.fanning .fcard{transition:transform .95s var(--e),opacity .65s var(--e),filter .65s var(--e)}
.fhit{display:block;width:100%;text-align:left;border-radius:22px;overflow:hidden;
  background:var(--paper);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 30px 64px -30px rgba(60,55,45,.5)}
.fcard.is-center .fhit{box-shadow:0 46px 90px -34px rgba(60,55,45,.62);border-color:#fff}
.fshot{display:block;aspect-ratio:4/3.1;overflow:hidden;background:#E4E2DC;
  border-radius:22px 22px 0 0}
.fshot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--e)}
.fcard.is-center .fhit:hover .fshot img{transform:scale(1.045)}
.fmeta{display:block;padding:.95rem 1.05rem 1.1rem}
.frow{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.ftag{display:flex;align-items:center;gap:.4rem;font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ftag i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.fbadge{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:.28rem .55rem;border-radius:100px;
  background:var(--ink);color:var(--paper);white-space:nowrap}
.fcard h3{font-size:1.3rem;font-weight:600;letter-spacing:-.025em;line-height:1.15;
  margin:.35rem 0 .4rem}
.fteaser{font-size:.84rem;color:var(--muted);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.fchips span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:.3rem .55rem;border-radius:100px;
  background:rgba(200,107,67,.1);color:#9C5433}
.fcta{display:flex;align-items:center;justify-content:center;gap:.6rem;
  margin-top:.9rem;padding:.7rem;border-radius:100px;background:var(--ink);
  color:var(--paper);font-size:.88rem;font-weight:500;
  opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--e),transform .5s var(--e)}
.fcard.is-center .fcta{opacity:1;transform:none;transition-delay:.18s}
.fcta em{font-style:normal;transition:transform .35s var(--e)}
.fhit:hover .fcta em{transform:translateX(4px)}

.flow-nav{display:flex;justify-content:center;align-items:center;gap:.6rem;
  margin-top:clamp(1.4rem,4vh,2.2rem)}
.flow-nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);
  display:grid;place-items:center;background:rgba(255,255,255,.6);
  transition:background .3s,color .3s,transform .3s var(--e)}
.flow-nav button:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
.flow-dots{display:flex;gap:.4rem;margin:0 .5rem}
.flow-dots button{width:7px;height:7px;border-radius:50%;background:var(--rule);
  border:0;padding:0;transition:background .3s,width .3s var(--e)}
.flow-dots button.on{background:var(--accent);width:20px;border-radius:100px}

/* ── the breakdown, centred over the page ── */
.bd-scrim{position:fixed;inset:0;z-index:80;background:rgba(239,237,232,.55);
  backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .45s var(--e)}
.bd-scrim.on{opacity:1;pointer-events:auto;touch-action:none;overscroll-behavior:contain}
/* the page is PINNED while a modal is open - iOS Safari touch-scrolls straight
   through overflow:hidden, which is how a reader loses their place */
.bd{position:fixed;z-index:81;inset:clamp(1rem,4vh,3rem) clamp(1rem,4vw,3rem);
  margin:auto;max-width:1080px;max-height:min(88svh,860px);
  background:rgba(255,255,255,.9);backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.95);border-radius:26px;
  box-shadow:0 50px 110px -50px rgba(60,55,45,.65);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(22px) scale(.97);pointer-events:none;
  transition:opacity .5s var(--e),transform .5s var(--e)}
.bd.on{opacity:1;transform:none;pointer-events:auto}
.bd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
  padding:1.3rem clamp(1.1rem,3vw,1.9rem) .9rem;border-bottom:1px solid var(--rule)}
.bd-top h3{font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.05;letter-spacing:-.02em}
.bd-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);
  display:grid;place-items:center;flex:none;transition:background .3s,color .3s}
.bd-close:hover{background:var(--ink);color:var(--paper)}
/* the only scrollable thing while the modal is open, and only when its content
   overflows. `contain` stops a flick at the end chaining out to the page. */
.bd-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
  gap:clamp(1rem,3vw,2rem);padding:clamp(1.1rem,3vw,1.9rem);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
.bd-shots{position:relative;border-radius:16px;overflow:hidden;background:#E4E2DC;
  border:1px solid var(--rule);align-self:start}
.bd-rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.bd-rail::-webkit-scrollbar{display:none}
.bd-rail figure{flex:0 0 100%;scroll-snap-align:center}
.bd-rail img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.bd-dots{display:flex;gap:.4rem;justify-content:center;padding:.6rem}
.bd-dots button{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.bd-dots button.on{background:var(--accent)}
.bd-side .teaser{margin:.7rem 0 1rem;color:var(--muted);font-size:.95rem}
.bd-scope{display:grid;gap:.5rem;border-top:1px solid var(--rule);padding-top:.9rem}
.bd-scope div{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem}
.bd-scope b{font-weight:600}
.bd-scope span{color:var(--muted);text-align:right}
.bd-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:.34rem .6rem;border-radius:100px;
  background:rgba(200,107,67,.1);color:#9C5433}

/* ══════════════════════════════════════════════════════════════════════
   THE FULL PICTURE
   ══════════════════════════════════════════════════════════════════════ */
.about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);
  gap:clamp(1.5rem,5vw,4rem);align-items:start}
.about .lead{font-size:clamp(1.05rem,1.9vw,1.32rem);line-height:1.5;text-wrap:pretty}
.about .body{margin-top:1rem;color:var(--muted);font-size:.98rem}
.facts{border-top:1px solid var(--rule)}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;
  border-bottom:1px solid var(--rule);font-size:.9rem}
.fact b{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted)}

/* ══════════════════════════════════════════════════════════════════════
   TOOLKIT - a full page of bare icons and accent labels, rising. No pill
   containers: the marks and the words ARE the page. On advance the whole
   field lifts away, and that flight IS the transition into Experience.
   ══════════════════════════════════════════════════════════════════════ */
#skills{overflow:hidden}
.field{position:relative;height:clamp(460px,64vh,720px);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);
  display:grid;gap:clamp(.8rem,2.4vw,2rem)}
.lane{position:relative;overflow:hidden}
/* NO gap here, and every mark carries its own trailing space instead. With a
   flex gap the track is 2n*h + (2n-1)*g tall, so translateY(-50%) moves half
   a gap short of one full copy and the loop jumps by that much every cycle -
   the jerk you could see. Folding the gap into each item makes the track
   exactly two identical copies, so -50% lands dead on the seam. */
.lane-track{display:flex;flex-direction:column;align-items:center;gap:0;
  animation:rise var(--dur) linear infinite;
  will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
/* direction follows travel: arriving forwards the columns climb, arriving
   backwards they fall, so the field moves the way the reader is moving */
.field.down .lane-track{animation-direction:reverse}
/* clicking freezes it so the marks can actually be read; clicking again
   sets it going. Hover no longer pauses - it fought the click. */
.field.held .lane-track{animation-play-state:paused}
@keyframes rise{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
.field{cursor:pointer}
.fieldhint{text-align:center;margin-top:.9rem;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  transition:opacity .4s var(--e)}
.tool{display:flex;flex-direction:column;align-items:center;gap:.5rem;
  color:var(--accent);text-align:center;
  margin-bottom:clamp(1.6rem,4vh,2.8rem)}
.tool svg{width:clamp(26px,3vw,38px);height:clamp(26px,3vw,38px);display:block}
.tool span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.tool.grow span{color:var(--ink)}
/* the lift-off: the field accelerates upward and thins out */
#skills.launch .liftoff{animation:launch 1.3s cubic-bezier(.55,0,.85,.3) forwards}
#skills.launch .lane-track{animation-play-state:running}
/* the heading is part of the flight, not a fixed label the field slides under */
.liftoff{display:flex;flex-direction:column;gap:clamp(1rem,3vh,2rem)}
@keyframes launch{
  0%{transform:translateY(0);opacity:1;filter:blur(0)}
  100%{transform:translateY(-115vh);opacity:0;filter:blur(5px)}
}


/* ══════════════════════════════════════════════════════════════════════
   EXPERIENCE
   ══════════════════════════════════════════════════════════════════════ */
.tl{position:relative;padding-left:clamp(1.4rem,4vw,2.6rem)}
.tl::before{content:'';position:absolute;left:0;top:.4rem;bottom:.4rem;width:2px;background:var(--rule)}
.tl-fill{position:absolute;left:0;top:.4rem;width:2px;height:0;background:var(--accent);
  transition:height .2s linear}
.job{position:relative;padding-bottom:2.4rem}
.job::before{content:'';position:absolute;left:calc(-1 * clamp(1.4rem,4vw,2.6rem) - 4px);
  top:.55rem;width:10px;height:10px;border-radius:50%;background:var(--ground);
  border:2px solid var(--accent)}
.job h3{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;margin-top:.2rem}
.job .co{color:var(--accent);font-size:.9rem;margin-bottom:.6rem}
.job ul{list-style:none;display:grid;gap:.45rem}
.job li{position:relative;padding-left:1rem;font-size:.93rem;color:var(--muted)}
.job li::before{content:'';position:absolute;left:0;top:.6em;width:5px;height:5px;
  border-radius:50%;background:var(--rule)}

/* ══════════════════════════════════════════════════════════════════════
   CONTACT
   ══════════════════════════════════════════════════════════════════════ */
#contact{text-align:center}
.ask{font-family:'Instrument Serif',serif;font-weight:400;
  font-size:clamp(1.9rem,5.2vw,4rem);line-height:1.16;letter-spacing:-.025em;
  max-width:22ch;margin:0 auto}
.clinks{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.cl{padding:.6rem 1.1rem;border-radius:100px;background:rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.9);font-size:.88rem;
  box-shadow:0 12px 26px -18px rgba(60,55,45,.5);transition:transform .3s var(--e)}
.cl:hover{transform:translateY(-3px)}
.cl b{font-weight:600}
.cl span{color:var(--muted);margin-left:.5rem}

.cform{position:fixed;right:clamp(1rem,3vw,2rem);bottom:clamp(1rem,3vw,2rem);
  z-index:90;width:min(calc(100vw - 2rem),400px);
  background:rgba(255,255,255,.92);backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.95);border-radius:24px;
  box-shadow:0 40px 90px -44px rgba(60,55,45,.7);padding:1.3rem;
  transform-origin:100% 100%;
  opacity:0;transform:translateY(18px) scale(.9);pointer-events:none;
  transition:opacity .5s var(--e),transform .5s var(--e)}
.cform.on{opacity:1;transform:none;pointer-events:auto}
.cform h4{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.5rem;letter-spacing:-.02em}
.cform p{font-size:.82rem;color:var(--muted);margin-bottom:.9rem}
.cform label{display:block;margin-bottom:.6rem}
.cform span{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.cform input,.cform textarea{width:100%;font:inherit;font-size:.9rem;padding:.55rem .7rem;
  border:1px solid var(--rule);border-radius:12px;background:rgba(255,255,255,.7)}
.cform textarea{resize:vertical;min-height:76px}
.cform .send{width:100%;margin-top:.5rem;padding:.7rem;border-radius:100px;
  background:var(--accent);color:#fff;font-size:.92rem;transition:transform .3s var(--e)}
.cform .send:hover{transform:translateY(-2px)}
.cform .min{position:absolute;top:.9rem;right:.9rem;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--rule);display:grid;place-items:center;font-size:1.1rem;line-height:1}
.cform .min:hover{background:var(--ink);color:var(--paper)}

.fab{position:fixed;right:clamp(1rem,3vw,2rem);bottom:clamp(1rem,3vw,2rem);z-index:89;
  width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;box-shadow:0 20px 44px -20px rgba(60,55,45,.8);
  transition:transform .4s var(--e),opacity .3s}
.fab svg{width:22px;height:22px}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab[hidden]{display:none}
.fab.beckon::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1px solid var(--accent);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}

footer{padding:2rem 0 0;border-top:1px solid var(--rule)}
.contact-mid{flex:1;display:flex;flex-direction:column;justify-content:center}
/* the footer already holds the floor here, so the panel's own bottom padding
   would only push the question up off centre */
#contact .panel-inner{padding-bottom:0}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* ══════════════════════════════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════════════════════════════ */
@media (max-width:700px){
  /* the contact button is fixed bottom-right and paints over everything, so
     the centred note has to stay clear of the ~74px it occupies */
  .pilenote{font-size:9.5px;letter-spacing:.1em}
}
@media (max-width:900px){
  .b-intro{grid-template-columns:minmax(0,1fr);gap:1.4rem;text-align:center;
    justify-items:center}
  /* the desktop rule right-aligns the copy against the centre column; stacked
     there is no centre column to align to, so it goes back to centred */
  .b-intro .copyside{justify-self:center;max-width:26rem}
  /* On a phone the fan is dropped entirely: the intro is card, name, line,
     arrow - and the work gets the Up and running deck to itself, which is a
     better read on a small screen than a rail nobody scrolls. The focus card
     goes with it: it belongs to the arc, and a pick made at desktop width
     would otherwise still be sitting over the intro after a resize. */
  .arc,.focus-work{display:none}
  .b-intro .cardside{order:-1}
  /* the beats stay centred on the screen; they fit without scrolling */
  .stage{padding-top:clamp(2rem,6vh,3.5rem)}
  .b-intro h1{font-size:clamp(2.6rem,13vw,3.6rem)}
  .b-welcome .line{font-size:clamp(1.7rem,7.6vw,2.4rem)}
  /* The deck, its controls and its note all have to land above the gate now
     that it is lifted clear of the bottom edge. Rather than squeeze the
     container - which sliced the card's own button off - the card itself is
     made shorter: a two line teaser and tighter chrome. */
  .flow{height:clamp(340px,44vh,390px);padding:10px 0 16px}
  /* a wider crop keeps the whole card, button included, inside the frame */
  .fshot{aspect-ratio:16/9}
  .flow-nav{margin-top:.7rem}
  .pilenote{margin-top:.5rem !important}
  .fteaser{-webkit-line-clamp:2}
  .fcard h3{font-size:1.12rem;margin:.25rem 0 .3rem}
  .fmeta{padding:.7rem .85rem .8rem}
  .fchips{margin-top:.5rem}
  .fcta{margin-top:.6rem;padding:.58rem;font-size:.82rem}
  #work .sec-head{margin-bottom:.8rem}
  .panel-inner{padding-bottom:clamp(11rem,26vh,15rem)}
  .b-statement .say{font-size:clamp(1.5rem,6.4vw,2.1rem)}
  .b-intro .tools{margin-top:.9rem;font-size:1rem;line-height:1.6}
  .pcard{width:min(100%,250px)}
  .b-intro .pcard{width:min(100%,300px)}
  .about{grid-template-columns:minmax(0,1fr)}
  .bd-body{grid-template-columns:minmax(0,1fr)}
  .bd{inset:.6rem;max-height:94svh}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fade{opacity:1;transform:none;transition:none}
  .lane-track{animation:none}
  .gate-btn{animation:none}
  .gate-btn::after{animation:none}
  .c.tip::after{animation:none}
  .fab.beckon::after{animation:none}
  #skills.launch .liftoff{animation-duration:.01s}
}
</style>

const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Resolves once an element has finished sliding into place. Typing that
   begins while its own block is still travelling reads as the text jumping
   upward as characters appear - which is exactly what a long entrance plus an
   immediate write-out produced. Falls back to a timeout so a transition that
   never fires cannot stall the sequence. */
function settled(el, prop = 'transform', max = 900){
  if (REDUCED || !el) return Promise.resolve();
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.removeEventListener('transitionend', onEnd);
      resolve();
    };
    const onEnd = (e) => { if (e.target === el && e.propertyName === prop) finish(); };
    el.addEventListener('transitionend', onEnd);
    setTimeout(finish, max);
  });
}
const emph = (s) => s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function icon(name){
  const d = ICONS[name];
  return d ? `<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor"><path d="${d.path}"/></svg>` : '';
}

/* ── the typewriter ──────────────────────────────────────────────────
   Copy is split into at most four balanced lines, then every character of
   every line is rendered up front as its own hidden span. Typing reveals
   them in order. Because the full text is already laid out, nothing moves:
   no re-centring, no rewrap, no jitter.
   ------------------------------------------------------------------- */
const MAX_LINES = 4;

function wrapLines(text, target){
  const words = text.split(' ');
  const n = Math.min(MAX_LINES, Math.max(1, Math.ceil(text.length / target)));
  if (n === 1) return [text];
  // aim every line at the same length, so the block sits evenly
  const per = Math.ceil(text.length / n);
  const lines = [];
  let cur = '';
  for (const w of words){
    const grown = cur ? `${cur} ${w}` : w;
    if (cur && grown.length > per && lines.length < n - 1){ lines.push(cur); cur = w; }
    else cur = grown;
  }
  if (cur) lines.push(cur);
  return lines;
}

// one span per character, emphasis preserved, everything hidden to start
function buildLine(line){
  const html = emph(esc(line));
  const holder = document.createElement('span');
  holder.innerHTML = html;
  const out = document.createElement('span');
  out.className = 'tline';
  const cells = [];
  const cell = (ch, into) => {
    const sp = document.createElement('span');
    sp.className = 'c';
    sp.textContent = ch;
    into.appendChild(sp);
    cells.push(sp);
  };
  const walk = (src, dest) => {
    src.childNodes.forEach((node) => {
      if (node.nodeType === 3){
        // split on whitespace so a line can only ever break BETWEEN words
        node.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)){
            for (const ch of part) cell(ch, dest);
          } else {
            const w = document.createElement('span');
            w.className = 'w';
            dest.appendChild(w);
            for (const ch of part) cell(ch, w);
          }
        });
      } else {
        const tag = document.createElement(node.tagName);
        dest.appendChild(tag);
        walk(node, tag);
      }
    });
  };
  walk(holder, out);
  return { node: out, cells };
}

function buildBlock(host, text){
  const target = Number(host.dataset.wrap) || 42;
  const lines = wrapLines(text, target);
  host.classList.add('tblock');
  host.textContent = '';
  const cells = [];
  lines.forEach((l) => {
    const built = buildLine(l);
    host.appendChild(built.node);
    cells.push(...built.cells);
  });
  return cells;
}

/* Every typed block is built ONCE, up front, before anything is shown. That
   is what keeps the layout still: the copy already occupies its final box, so
   a column cannot widen mid-sentence and shove a neighbour (the profile card)
   sideways. Typing then only flips characters visible. */
function prepareType(root){
  root.querySelectorAll('.type').forEach((n) => {
    if (n.dataset.built) return;
    n.dataset.built = '1';
    buildBlock(n, CONTENT.script[n.dataset.type]);
  });
}

function typeText(host, text){
  if (host.dataset.typed) return Promise.resolve();
  host.dataset.typed = 'done';
  if (!host.dataset.built){ host.dataset.built = '1'; buildBlock(host, text); }
  const cells = [...host.querySelectorAll('.c')];

  if (REDUCED){ cells.forEach((c) => c.classList.add('on')); return Promise.resolve(); }

  /* Driven by the frame clock, not by a chain of timers. setTimeout drifts and
     is clamped by the browser, and the old version added random jitter and a
     long pause on punctuation on top of that - which is what read as stalling
     and stuttering. How many characters should be showing is now a pure
     function of elapsed time, so the reveal is even and frame-accurate. The
     layout never moves either way: every character is already in place and
     only its visibility flips. */
  const rate = clamp(1500 / Math.max(12, cells.length), 13, 46);
  const lead = 180;
  host.classList.add('writing');

  return new Promise((resolve) => {
    let start = performance.now();
    let last = start;
    let shown = 0;
    let tip = null;
    const frame = (now) => {
      // If frames stopped for a while - a hidden tab pauses rAF entirely - do
      // not let the elapsed time cash in all at once and dump the rest of the
      // line on screen. Slide the clock instead and carry on from here.
      if (now - last > 400) start += now - last;
      last = now;
      const due = clamp(Math.floor((now - start - lead) / rate), 0, cells.length);
      while (shown < due){
        cells[shown].classList.add('on');
        shown += 1;
      }
      if (shown > 0 && cells[shown - 1] !== tip){
        if (tip) tip.classList.remove('tip');
        tip = cells[shown - 1];
        tip.classList.add('tip');
      }
      if (shown < cells.length){ requestAnimationFrame(frame); return; }
      host.classList.remove('writing');
      setTimeout(() => { if (tip) tip.classList.remove('tip'); resolve(); }, 140);
    };
    requestAnimationFrame(frame);
  });
}

// writes every .type inside a container, one line after the next
function typeGroup(root, gap = 260){
  if (root.dataset.typing) return Promise.resolve();
  root.dataset.typing = 'done';
  const lines = [...root.querySelectorAll('.type')];
  return lines.reduce(
    (chain, n, i) => chain
      .then(() => typeText(n, CONTENT.script[n.dataset.type]))
      // no pause after the LAST line: whatever comes next (the arrow) should
      // arrive as the final character does, not a beat behind it
      .then(() => wait(REDUCED || i === lines.length - 1 ? 0 : gap)),
    Promise.resolve(),
  );
}

/* Each beat plays its own animation, then stops and raises the gate. The
   sequence is written out here rather than spread across CSS delays, so the
   pacing of one beat is edited in one place. */
async function playBeat(i){
  const beat = beats[i];
  beat.classList.remove('out');
  beat.classList.add('on');
  // let the beat land before a single character is written into it
  await settled(beat);

  if (beat.dataset.beat === 'intro'){
    // name, card, a short beat, the line - and the work deals itself out the
    // moment the line lands, so nobody has to be told to go and look
    const name = beat.querySelector('[data-type="name"]');
    const tools = beat.querySelector('[data-type="tools"]');
    await typeText(name, S.name);
    await wait(REDUCED ? 0 : 240);
    beat.querySelector('.pcard').classList.add('shown');
    await wait(REDUCED ? 0 : 850);
    await typeText(tools, S.tools);
    dealArc();
    await wait(REDUCED ? 0 : 380);
  } else {
    await typeGroup(beat);
  }

  showGate(true, i === ACT_ONE.length - 1 ? introEndLabel() : ACT_ONE[i].gate);
}

async function goToBeat(i){
  if (advancing) return;
  advancing = true;
  showGate(false);

  if (beatAt >= 0){
    // the change happens inside a bank of light rather than in plain sight
    veil.classList.add('on');
    await wait(REDUCED ? 0 : 420);
    beats[beatAt].classList.add('out');
    beats[beatAt].classList.remove('on');
    await wait(REDUCED ? 0 : 120);
    veil.classList.remove('on');
  }

  beatAt = i;
  advancing = false;
  await playBeat(i);
}

/* ── the deck ────────────────────────────────────────────────────────
   With the document frozen, navigation IS this. `at` is the panel the
   reader is on; nothing else is visible or focusable.

   FORWARD is gated: the arrow, or the forward keys, and nothing else.
   BACKWARD is free: the back chevron, the up keys, or simply scrolling up.
   Going back should never be work.
   ------------------------------------------------------------------- */
const allPanels = [...document.querySelectorAll('main .panel')];
/* Panels that only belong on a small screen. On desktop the work already
   fans out behind the profile card in the intro beat, so a second pass at
   the same six projects is a repeat; on a phone the fan is dropped and this
   deck IS how the work gets shown. */
const NARROW_ONLY = new Set(['work']);
const isNarrow = () => window.innerWidth <= 900;

let panels = [];
let PANEL_IDS = [];
// panels that exist only to be travelled through. Entering one forwards plays
// its flight and hands on; going backwards skips it, or the reader would be
// bounced straight forward again by its own animation.
// Nothing auto-flies through any more: the toolkit is somewhere you arrive,
// read, and leave by the arrow. Kept as a set so a section can be made a
// pure corridor again by naming it here.
const TRANSITION = new Set();
let at = 0;
let moving = false;

function panelIndex(sel){ return PANEL_IDS.indexOf(String(sel).replace('#', '')); }

/* Rebuilds the deck for the current width. Called at boot and whenever a
   resize crosses the breakpoint, so a panel cannot be stranded as the active
   one after it has been dropped from the running order. */
function syncDeck(){
  // a project chosen from the fan has no place in the narrow layout
  if (isNarrow()) clearWork();
  const current = panels[at] ? panels[at].id : 'intro';
  panels = allPanels.filter((p) => !(NARROW_ONLY.has(p.id) && !isNarrow()));
  PANEL_IDS = panels.map((p) => p.id);
  allPanels.forEach((p) => {
    const dropped = !panels.includes(p);
    p.classList.toggle('off', dropped);
    if (dropped) p.classList.remove('active');
  });
  let i = PANEL_IDS.indexOf(current);
  if (i < 0) i = Math.min(PANEL_IDS.length - 1, Math.max(0, at));   // it was dropped
  at = i;
  panels.forEach((p, n) => p.classList.toggle('active', n === at));
  updateBackButtons();
}

// where the intro hands off depends on whether the work deck is in play
const afterIntro = () => (isNarrow() ? '#work' : '#about');
const introEndLabel = () => (isNarrow() ? 'See the work' : 'The full picture');

async function goPanel(i, { back = false } = {}){
  if (back) while (i > 0 && TRANSITION.has(PANEL_IDS[i])) i -= 1;
  if (moving || i < 0 || i >= panels.length || i === at) return;
  moving = true;
  const from = panels[at];
  const to = panels[i];

  showGate(false);
  try {
    from.classList.add(back ? 'leave-down' : 'leave-up');
    if (back) to.classList.add('from-above');

    if (!REDUCED){
      veil.classList.add('on');
      await wait(230);
    }
    from.classList.remove('active');
    to.classList.add('active');
    // a panel always opens at its own top, never halfway down from last time
    to.scrollTop = 0;
    at = i;
    if (!REDUCED){
      await wait(60);
      veil.classList.remove('on');
    }
  } finally {
    // `moving` must clear even if something above throws: leave it set and the
    // deck wedges for good, with every arrow and key silently doing nothing
    from.classList.remove('leave-down', 'leave-up');
    to.classList.remove('from-above');
    veil.classList.remove('on');
    moving = false;
  }
  updateBackButtons();
  if (to.id === 'skills') setFieldDirection(back);
  // same rule for a panel: it finishes arriving before anything types
  settled(to, 'transform', 700).then(() => reveal(to));

  // a transition panel plays itself and moves on, unprompted
  if (!back && TRANSITION.has(to.id)) setTimeout(() => launchToolkit(GATES[to.id].next), REDUCED ? 0 : 620);
}

function updateBackButtons(){
  // nothing to go back to from the opening beat of the opening panel
  document.getElementById('gateBack').hidden = at === 0 && beatAt <= 0;
}

function handOff(sel){
  const i = panelIndex(sel);
  if (i >= 0) goPanel(i);
}

function goBack(){ goPanel(at - 1, { back: true }); }



/* The same two moves from the keyboard. Without this the gate would lock out
   anyone not using a mouse, which is the one cost of hard-gating worth
   refusing to pay. */
document.addEventListener('keydown', (e) => {
  if (breakdownOpen || formOpen) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const fwd = ['ArrowDown', 'PageDown', ' ', 'Spacebar'];
  const bwd = ['ArrowUp', 'PageUp'];
  // the coverflow owns left/right, so the deck deliberately does not
  if (fwd.includes(e.key)){ e.preventDefault(); advance(); }
  else if (bwd.includes(e.key)){ e.preventDefault(); goBack(); }
});

/* Scrolling UP goes back. Forward scrolling stays gated, so the wheel can
   only ever retreat. A panel that scrolls internally has to reach its own
   top first, or the gesture would yank the reader out of half-read copy. */
let gestureLock = 0;
function atTop(){ return (panels[at]?.scrollTop || 0) <= 1; }
function tryBack(){
  const now = performance.now();
  if (moving || breakdownOpen || now < gestureLock || !atTop()) return;
  gestureLock = now + 700;
  goBack();
}

window.addEventListener('wheel', (e) => { if (e.deltaY < -12) tryBack(); }, { passive: true });

let touchY = null;
window.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (touchY === null) return;
  // finger travelling DOWN the screen is the content moving up: going back
  if (e.touches[0].clientY - touchY > 60){ touchY = null; tryBack(); }
}, { passive: true });
window.addEventListener('touchend', () => { touchY = null; }, { passive: true });

// what the forward key does depends on where you are
function advance(){
  const panel = panels[at];
  if (panel.id === 'intro'){
    if (beatAt < beats.length - 1) goToBeat(beatAt + 1);
    else handOff(afterIntro());
    return;
  }
  const next = GATES[panel.id] && GATES[panel.id].next;
  if (!next) return;
  // the toolkit's exit IS its transition, so let the field fly before moving
  if (panel.id === 'skills') launchToolkit(next);
  else handOff(next);
}

/* ── revealing a panel ──────────────────────────────────────────────── */
const revealed = new Set();

function reveal(section){
  if (!section || revealed.has(section.id)) return;
  revealed.add(section.id);
  section.querySelectorAll('.fade').forEach((n) => n.classList.add('in'));

  if (section.id === 'work'){
    // heading first, then the cards land, and only THEN the note - typing all
    // three before the fan left a big empty stage for several seconds
    typeGroup(section.querySelector('.sec-head'))
      .then(() => { fanIn(); raiseGate(section); return wait(REDUCED ? 0 : 420); })
      .then(() => typeGroup(section.querySelector('.pilenote')));
  } else if (section.id === 'contact'){
    // the form opens itself once the question has finished asking
    typeGroup(section).then(() => {
      raiseGate(section);
      return wait(REDUCED ? 0 : 320);
    }).then(() => { if (!breakdownOpen) setForm(true); });
  } else {
    if (section.id === 'experience') fillTimeline();
    raiseGate(section);
  }
}

function raiseGate(section){
  const g = GATES[section.id];
  if (!g) return;
  setTimeout(() => showGate(true, g.label), REDUCED ? 0 : 260);
}

/* ── the work, as a half circle ──────────────────────────────────────
   The cards sit on an arc opening leftward, so the fan wraps around the
   profile card in the centre rather than queueing beside it. ARC is the
   whole shape: change these four numbers and the curve changes.
   ------------------------------------------------------------------- */
/* A true half circle. The cards sit ON the curve: it starts at the top
   right, sweeps out to the left at the midpoint, and returns to the bottom
   right. Equal angular steps means equal spacing ALONG the arc, which is
   what reads as uniform, and each card leans with the tangent. */
/* Two branches from the middle of the profile card: one climbing, one
   dropping, each card starting half a card along from the last, both curving
   right on the same circle until they meet the screen border.

   The card size is SOLVED rather than picked: given the branch length, the
   overlap and the curvature, there is exactly one card height that lands the
   outermost card on the border. That is what keeps the spacing uniform and
   the cards as large as the space allows. */
/* Taken straight off the reference drawing, which measures as two straight
   fans rather than a curve:
     - every card steps sideways by exactly HALF A CARD WIDTH
     - the innermost card's centre sits on the profile card's edge
     - the vertical steps are uniform, and the first offset is ~3x one step
     - depth runs inward: the nearest card is darkest, the furthest lightest
   The reference canvas is square; a widescreen has far less height than
   width, so the vertical spread is scaled to fit while its proportions and
   every horizontal rule above are kept exactly. */
const ARC = {
  perBranch: 3,     // cards climbing, and the same number dropping
  stepX: 0.5,       // sideways travel per card, in card widths
  dropRatio: 3.05,  // first vertical offset, in vertical steps
  margin: 14,       // clearance kept from every border
  depth: [          // per rank out from the middle, nearest first
    { sat: 1,    br: 1     },
    { sat: 0.82, br: 0.985 },
    { sat: 0.62, br: 0.97  },
  ],
  minCard: 190,
  maxCard: 380,
};
const THUMB = 3 / 4;    // the card's picture aspect, used to solve its height

const items = CONTENT.portfolio;
const arc = document.getElementById('arc');
const focus = document.getElementById('focus');
const focusWork = document.getElementById('focusWork');
const KIND = { project: 'Project', site: 'Client site' };
let chosen = null;

arc.innerHTML = items.map((p, i) => `
  <div class="acard" data-key="${p.key}" data-i="${i}" style="--i:${i}" role="listitem">
    <button class="acard-hit" aria-label="Bring ${p.title} to the centre">
      <span class="thumb"><img src="${p.shot}" alt="" loading="lazy" /></span>
      <span class="cap"><b>${p.title}</b><span>${p.tag}</span></span>
    </button>
  </div>`).join('');

const acards = [...arc.querySelectorAll('.acard')];

function layoutArc(){
  // the phone layout is a plain scrolling rail, so the maths is skipped
  if (window.innerWidth <= 900){
    acards.forEach((c) => c.removeAttribute('style'));
    acards.forEach((c, i) => c.style.setProperty('--i', i));
    return;
  }
  const beat = arc.parentElement;
  const br = beat.getBoundingClientRect();
  const slot = beat.querySelector('.focus');
  const sr = slot.getBoundingClientRect();
  // everything is measured from the middle of the profile card
  const cx = sr.left + sr.width / 2 - br.left;
  const cy = sr.top + sr.height / 2 - br.top;
  const vx = sr.left + sr.width / 2;         // the same point, in the viewport
  const vy = sr.top + sr.height / 2;

  const P = ARC.perBranch;
  const M = ARC.margin;
  const capH = arc.querySelector('.cap').getBoundingClientRect().height || 43;
  const halfPW = sr.width / 2;      // the profile card's half width and height
  const halfPH = sr.height / 2;

  // WIDTH comes from the sideways rule: the outermost card's far edge lands on
  // the screen border, having stepped half a card at a time from the profile
  // card's edge.  halfPW + (P-1)*aw/2 + aw/2 = spaceToBorder
  const spaceX = innerWidth - M - vx - halfPW;
  const aw = clamp(spaceX / (P / 2), ARC.minCard, ARC.maxCard);
  const h = aw * THUMB + capH;

  // HEIGHT is what a widescreen cannot give at the reference's scale, so the
  // spread is fitted to the room there is, keeping the reference's 3.05:1
  // ratio between the first offset and each step after it.
  const budget = Math.min(vy, innerHeight - vy) - M - h / 2;
  const step = Math.max(18, budget / (ARC.dropRatio + (P - 1)));
  const drop = step * ARC.dropRatio;

  acards.forEach((c, i) => {
    const up = i < P;
    const j = up ? i : i - P;                       // rank out from the middle
    const dx = halfPW + j * (aw * ARC.stepX);       // exactly half a card, each
    const dy = drop + j * step;
    const d = ARC.depth[Math.min(j, ARC.depth.length - 1)];
    c.style.setProperty('--aw', `${aw.toFixed(1)}px`);
    c.style.setProperty('--x', `${(cx + dx - aw / 2).toFixed(1)}px`);
    c.style.setProperty('--y', `${(cy + (up ? -dy : dy) - h / 2).toFixed(1)}px`);
    c.style.setProperty('--rot', '0deg');           // upright, every one of them
    c.style.setProperty('--sat', d.sat);
    c.style.setProperty('--br', d.br);
    // Nearest the middle sits in front of its neighbours, which is what the
    // darkest card in the reference says. These stay UNDER the profile card
    // (z-index 5) so the ring reads as being behind it; hovering lifts one
    // clear above it, see .acard.lifted.
    c.style.setProperty('--z', String(4 - j));
  });
}

function dealArc(){ layoutArc(); arc.classList.add('dealt'); }

acards.forEach((c) => {
  const hit = c.querySelector('.acard-hit');
  c.addEventListener('mouseenter', () => c.classList.add('lifted'));
  c.addEventListener('mouseleave', () => c.classList.remove('lifted'));
  hit.addEventListener('focus', () => c.classList.add('lifted'));
  hit.addEventListener('blur', () => c.classList.remove('lifted'));
  hit.addEventListener('click', () => chooseWork(c.dataset.key));
});

/* Clicking an arc card moves it into the centre, taking the profile card's
   place. Clicking the centre card opens the full breakdown. */
function chooseWork(key){
  const p = items.find((x) => x.key === key);
  if (!p) return;
  chosen = key;
  acards.forEach((c) => c.classList.toggle('chosen', c.dataset.key === key));
  arc.classList.add('picked');   // hover lift stands down while one is open
  focusWork.innerHTML = `
    <article class="wfocus">
      <button class="back" data-clear aria-label="Back to the profile card">✕</button>
      <span class="shot"><img src="${p.shot}" alt="" /></span>
      <div class="body">
        <div class="row">
          <span class="ftag"><i></i>${p.tag}</span>
          <span class="fbadge">${KIND[p.kind]}</span>
        </div>
        <h3>${p.title}</h3>
        <p>${p.teaser}</p>
        <div class="chips">${p.stack.map((x) => `<span>${x}</span>`).join('')}</div>
        <button class="open" data-open>Open the breakdown <em>&rarr;</em></button>
      </div>
    </article>`;
  focusWork.querySelector('[data-open]').addEventListener('click', () => openBreakdown(key));
  focusWork.querySelector('[data-clear]').addEventListener('click', clearWork);
  focus.classList.add('on-work');
}

function clearWork(){
  chosen = null;
  acards.forEach((c) => c.classList.remove('chosen'));
  arc.classList.remove('picked');
  focus.classList.remove('on-work');
}

layoutArc();
window.addEventListener('resize', layoutArc);
// the beat shifts a little as fonts and images land, and the run is measured
// off the profile card - so measure again once those have settled
window.addEventListener('load', layoutArc);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutArc);

/* ── the portfolio coverflow ────────────────────────────────────────── */
const DEPTH = [
  { x: 0.00, s: 1.00, o: 1,    b: 0,   sat: 1,    br: 1    },
  { x: 0.68, s: 0.84, o: 0.95, b: 0.6, sat: 0.8,  br: 0.97 },
  { x: 1.30, s: 0.71, o: 0.78, b: 1.6, sat: 0.6,  br: 0.95 },
  { x: 1.95, s: 0.60, o: 0.55, b: 2.6, sat: 0.45, br: 0.94 },
];

const flowWrap = document.querySelector('.flow');
const flow = document.getElementById('flow');
const flowDots = document.getElementById('flowDots');
// `items` and `KIND` are already declared by the arc above: both views read
// the same seven entries, so the browse and the glance can never disagree
let active = Math.max(0, items.findIndex((p) => p.key === 'devdeck'));

flow.innerHTML = items.map((p, i) => `
  <article class="fcard" data-key="${p.key}" data-i="${i}">
    <button class="fhit">
      <span class="fshot"><img src="${p.shot}" alt="" loading="lazy" /></span>
      <span class="fmeta">
        <span class="frow">
          <span class="ftag"><i></i>${p.tag}</span>
          <span class="fbadge">${KIND[p.kind]}</span>
        </span>
        <h3>${p.title}</h3>
        <p class="fteaser">${p.teaser}</p>
        <span class="fchips">${p.stack.map((s) => `<span>${s}</span>`).join('')}</span>
        <span class="fcta">Open the breakdown <em>&rarr;</em></span>
      </span>
    </button>
  </article>`).join('');
flowDots.innerHTML = items.map((p, i) => `<button data-i="${i}" aria-label="Go to ${p.title}"></button>`).join('');

const cards = [...flow.querySelectorAll('.fcard')];
const dots = [...flowDots.querySelectorAll('button')];

function ringDist(i, from, n){
  let d = i - from;
  if (d > n / 2) d -= n;
  if (d < -n / 2) d += n;
  return d;
}
const cardWidth = () => clamp(window.innerWidth * 0.26, 230, 340);

function paintFlow(){
  const n = items.length;
  const cw = cardWidth();
  cards.forEach((c, i) => {
    const d = ringDist(i, active, n);
    const rank = Math.min(Math.abs(d), DEPTH.length - 1);
    const step = DEPTH[rank];
    c.style.setProperty('--cw', `${cw}px`);
    c.style.setProperty('--x', `${Math.sign(d) * step.x * cw}px`);
    c.style.setProperty('--s', step.s);
    c.style.setProperty('--o', step.o);
    c.style.setProperty('--b', `${step.b}px`);
    c.style.setProperty('--sat', step.sat);
    c.style.setProperty('--br', step.br);
    c.style.setProperty('--z', String(50 - Math.abs(d)));
    const center = d === 0;
    c.classList.toggle('is-center', center);
    const btn = c.querySelector('.fhit');
    btn.tabIndex = center ? 0 : -1;
    btn.setAttribute('aria-label',
      center ? `Open the ${items[i].title} breakdown` : `Bring ${items[i].title} forward`);
  });
  dots.forEach((d, i) => d.classList.toggle('on', i === active));
}

// the fan: cards leave one stack at the centre and deal out to their places
function fanIn(){
  if (flowWrap.classList.contains('fanned')) return;
  paintFlow();
  flowWrap.classList.add('fanning');
  // force the stacked state to be committed before the fanned one lands, so
  // the deal-out actually animates. A synchronous reflow rather than rAF:
  // rAF is deferred while the tab is backgrounded, and the cards would sit
  // invisible until it resumed.
  void flowWrap.offsetWidth;
  flowWrap.classList.add('fanned');
  setTimeout(() => flowWrap.classList.remove('fanning'), 1150);
}

function goTo(i){ active = ((i % items.length) + items.length) % items.length; paintFlow(); }

cards.forEach((c) => {
  c.querySelector('.fhit').addEventListener('click', () => {
    const i = Number(c.dataset.i);
    if (i === active) openBreakdown(c.dataset.key);
    else goTo(i);
  });
});
dots.forEach((d) => d.addEventListener('click', () => goTo(Number(d.dataset.i))));
document.getElementById('flowPrev').addEventListener('click', () => goTo(active - 1));
document.getElementById('flowNext').addEventListener('click', () => goTo(active + 1));
flowWrap.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(active - 1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); goTo(active + 1); }
});
let dragX = null;
flow.addEventListener('pointerdown', (e) => { dragX = e.clientX; });
flow.addEventListener('pointerup', (e) => {
  if (dragX === null) return;
  const dx = e.clientX - dragX; dragX = null;
  if (Math.abs(dx) > 45) goTo(active + (dx < 0 ? 1 : -1));
});
flow.addEventListener('pointercancel', () => { dragX = null; });
paintFlow();
window.addEventListener('resize', paintFlow);

/* ── freezing the page behind the breakdown ─────────────────────────
   The document cannot scroll at all now, so there is no body to pin. What
   can still move is the active panel's own overflow, so that is what gets
   frozen, and its offset is restored exactly on close.
   ------------------------------------------------------------------- */
let lockedTop = 0, scrollLocked = false, breakdownOpen = false;

function lockScroll(){
  if (scrollLocked) return;
  const p = panels[at];
  if (p){ lockedTop = p.scrollTop; p.style.overflowY = 'hidden'; }
  scrollLocked = true;
}
function unlockScroll(){
  if (!scrollLocked) return;
  const p = panels[at];
  if (p){ p.style.overflowY = ''; p.scrollTop = lockedTop; }
  scrollLocked = false;
}

/* ── the breakdown panel ────────────────────────────────────────────── */
const bd = document.getElementById('bd');
const bdScrim = document.getElementById('bdScrim');
let lastFocus = null;

function openBreakdown(key){
  const p = items.find((x) => x.key === key);
  if (!p) return;
  lastFocus = document.activeElement;
  bd.innerHTML = `
    <div class="bd-top">
      <div><p class="mono">${p.tag}</p><h3>${p.title}</h3></div>
      <button class="bd-close" aria-label="Close">✕</button>
    </div>
    <div class="bd-body">
      <div class="bd-shots">
        <div class="bd-rail">${p.shots.map((s) => `<figure><img src="${s.src}" alt="${s.title}" /></figure>`).join('')}</div>
        ${p.shots.length > 1 ? `<div class="bd-dots">${p.shots.map((s, i) => `<button aria-label="${s.title}"${i === 0 ? ' class="on"' : ''}></button>`).join('')}</div>` : ''}
      </div>
      <div class="bd-side">
        <p class="mono">What it is</p>
        <p class="teaser">${p.teaser}</p>
        <div class="bd-scope">${p.scope.map((s) => `<div><b>${s.k}</b><span>${s.v}</span></div>`).join('')}</div>
        <div class="bd-chips">${p.stack.map((s) => `<span class="chip">${s}</span>`).join('')}</div>
      </div>
    </div>`;

  const rail = bd.querySelector('.bd-rail');
  const bdots = [...bd.querySelectorAll('.bd-dots button')];
  bdots.forEach((d, i) => d.addEventListener('click', () => rail.scrollTo({ left: rail.clientWidth * i, behavior: 'smooth' })));
  rail.addEventListener('scroll', () => {
    const i = Math.round(rail.scrollLeft / rail.clientWidth);
    bdots.forEach((d, n) => d.classList.toggle('on', n === i));
  }, { passive: true });
  bd.querySelector('.bd-close').addEventListener('click', closeBreakdown);

  lockScroll();
  if (formOpen) setForm(false);
  breakdownOpen = true;
  syncFab();
  bd.classList.add('on');
  bdScrim.classList.add('on');
  bd.querySelector('.bd-close').focus({ preventScroll: true });
}

function closeBreakdown(){
  if (!bd.classList.contains('on')) return;
  bd.classList.remove('on');
  bdScrim.classList.remove('on');
  breakdownOpen = false;
  syncFab();
  unlockScroll();
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
bdScrim.addEventListener('click', closeBreakdown);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBreakdown(); });

/* ── the toolkit field ──────────────────────────────────────────────── */
const skills = document.getElementById('skills');
const field = document.getElementById('field');

function buildField(){
  const narrow = window.innerWidth < 700;
  const lanes = narrow ? 3 : window.innerWidth < 1050 ? 5 : 7;
  const all = CONTENT.caps.flatMap((c) => c.items.map((it) => ({ ...it, grow: !!c.growing })));

  // Every lane gets the SAME number of marks. Dealt round-robin off a list
  // that does not divide evenly, some columns ran short, so their tracks were
  // shorter and the field looked ragged and unevenly spaced across.
  const per = Math.ceil(all.length / lanes);
  const cols = Array.from({ length: lanes }, (_, i) =>
    Array.from({ length: per }, (_, j) => all[(j * lanes + i) % all.length]));

  field.style.gridTemplateColumns = `repeat(${lanes},minmax(0,1fr))`;
  field.innerHTML = cols.map((col, i) => {
    const marks = col.map((it) => `
      <span class="tool${it.grow ? ' grow' : ''}">${it.i ? icon(it.i) : ''}<span>${it.n}</span></span>`).join('');
    // Tracks are equal length now, so pace is set purely here. A wide desktop
    // field at 74s read as barely moving; a phone column still wants slow.
    const dur = narrow ? 70 + i * 8 : 34 + i * 3;
    // duplicated once so translateY(-50%) lands exactly on the seam
    return `<div class="lane"><div class="lane-track" style="--dur:${dur}s">${marks}${marks}</div></div>`;
  }).join('');
}
buildField();
let fieldTimer;
window.addEventListener('resize', () => { clearTimeout(fieldTimer); fieldTimer = setTimeout(buildField, 200); });

/* The field's direction mirrors how the reader got here, so the columns
   climb on the way forward and fall on the way back. */
function setFieldDirection(back){
  field.classList.toggle('down', !!back);
}

/* Click anywhere on the field to hold it still, click again to let it run.
   Without this the marks scroll past faster than they can be read. */
const fieldHint = document.getElementById('fieldHint');
function toggleHold(){
  const held = field.classList.toggle('held');
  fieldHint.textContent = held ? 'Held · click again to release' : 'Click to hold · click again to release';
}
field.addEventListener('click', toggleHold);
field.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleHold(); }
});
field.tabIndex = 0;
field.setAttribute('role', 'button');
field.setAttribute('aria-label', 'Hold or release the toolkit animation');

// the field flying away IS the page transition into Experience
function launchToolkit(next){
  if (skills.classList.contains('launch')) return;
  showGate(false);
  // a held field would fly away frozen, which reads as a bug
  field.classList.remove('held');
  skills.classList.add('launch');
  const done = () => { handOff(next); };
  if (REDUCED){ done(); return; }
  setTimeout(done, 880);
}

/* ── the timeline fill ──────────────────────────────────────────────
   Nothing to hang a scroll listener on any more, so the rule draws itself
   once the panel is reached.
   ------------------------------------------------------------------- */
const tlFill = document.getElementById('tlFill');
function fillTimeline(){
  if (!tlFill) return;
  setTimeout(() => { tlFill.style.transition = REDUCED ? 'none' : 'height 1.6s ease-out'; tlFill.style.height = '100%'; },
    REDUCED ? 0 : 500);
}

/* ── the contact form ───────────────────────────────────────────────── */
const cform = document.getElementById('cform');
const fab = document.getElementById('fab');
let formOpen = false;

// one place decides whether the floating button shows, so the form and the
// breakdown cannot disagree about it
function syncFab(){ fab.hidden = formOpen || breakdownOpen; }
function setForm(open){
  formOpen = open;
  cform.classList.toggle('on', open);
  syncFab();
}
fab.addEventListener('click', () => setForm(true));
document.getElementById('cformMin').addEventListener('click', () => setForm(false));
cform.addEventListener('submit', (e) => { e.preventDefault(); setForm(false); });
setForm(false);

const contactSec = document.getElementById('contact');
new IntersectionObserver((entries) => {
  entries.forEach((e) => fab.classList.toggle('beckon', e.isIntersecting && !formOpen && !breakdownOpen));
}, { threshold: 0.3 }).observe(contactSec);

// handle for driving the sequence from the console while designing
window.__narr = { goToBeat, goPanel, goBack, reveal, dealArc, chooseWork, fanIn, launchToolkit, typeText, wrapLines,
  panels: () => PANEL_IDS, at: () => at };

syncDeck();
// a resize that crosses the breakpoint changes the running order
let deckTimer;
window.addEventListener('resize', () => {
  clearTimeout(deckTimer);
  deckTimer = setTimeout(syncDeck, 220);
});
goToBeat(0);
</script>
